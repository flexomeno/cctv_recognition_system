# Copia este archivo a config.yaml. No subas config.yaml: lleva las claves del RTSP.

output_dir: data
database: data/inventory.db

# Exterior: el viento mueve puntos sueltos. El clip sale cuando un bloque compacto
# cambia durante varios frames. Bajar diff_threshold o min_area_ratio lo hace más sensible.
motion:
  diff_threshold: 30
  min_area_ratio: 0.01
  blur: 5
  confirm_frames: 3
  cooldown_s: 12
  analysis_width: 320

clip:
  duration_s: 10
  preroll_s: 3
  buffer_fps: 5

summary_interval_s: 60

# Cada clip de 10 s se envía a este chat. Crea el bot con @BotFather y escribe /start al bot.
telegram:
  bot_token: ""
  chat_id: ""

# Hasta 10 cámaras. En un DVR Dahua, subtype=0 es el flujo principal y subtype=1 el substream.
cameras:
  - id: dvr_ch1
    url: rtsp://usuario:clave@192.168.1.110:554/cam/realmonitor?channel=1&subtype=0
  # - id: dvr_ch2
  #   url: rtsp://usuario:clave@192.168.1.110:554/cam/realmonitor?channel=2&subtype=0
